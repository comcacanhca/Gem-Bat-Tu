name: Update Models JSON

on:
  push:
    paths:
      - '.github/workflows/update_models.yml'
  workflow_dispatch:

concurrency:
  group: update-models-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Model Health Check & Update JSON
        env:
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: "55716490813fcdf759a563a89f8e4046"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./gradlew updateModelsJson

      - name: Push models.json to Cloudflare KV
        env:
          CLOUDFLARE_ACCOUNT_ID: "55716490813fcdf759a563a89f8e4046"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler kv key put "models.json" --path="./app/src/main/assets/models.json" --namespace-id="f794e9bbb164423e9074cfc8a78de4b6" --remote

      - name: Commit and push if models.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/models.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update models.json via Health Check [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME:-master}
          fi
