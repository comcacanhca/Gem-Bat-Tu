name: Architecture Docs

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-docs:
    name: Generate Architecture Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Graphify
        run: pip install graphify

      - name: Generate Graphify Code Graph
        run: |
          python -m graphify extract . --code-only
          python -m graphify cluster-only .
          git rev-parse HEAD > graphify-out/GRAPH_COMMIT.txt

      - name: Copy Mermaid Diagrams
        run: |
          mkdir -p architecture/output/mermaid/sequences
          cp architecture/mermaid/sequences/*.mmd architecture/output/mermaid/sequences/

      - name: Upload Architecture Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-docs
          path: |
            graphify-out/graph.json
            graphify-out/graph.html
            graphify-out/GRAPH_REPORT.md
            architecture/output/mermaid/
          retention-days: 30